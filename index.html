<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Converter</title>
<meta name="theme-color" content="#0f3d3a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Converter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f1ea; --card:#ffffff; --ink:#14211f; --muted:#5f6d6a; --line:#e2ddd2;
  --brand:#0f3d3a; --brand-ink:#ffffff; --accent:#e8a33d; --chip:#e9e4d8; --warn:#b4541e;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1514; --card:#13211f; --ink:#e9efed; --muted:#93a5a1; --line:#22332f;
    --brand:#1d5c56; --brand-ink:#ffffff; --accent:#f0b354; --chip:#1a2c29; --warn:#f08a4b;}
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:10px 16px;min-height:44px;font:inherit;font-size:15px;
  background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:6px;
  box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -16px rgba(0,0,0,.25)}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
label.lab{font-size:13px;color:var(--muted)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:transparent;width:100%}
.amount{font-size:34px;font-weight:650;border:0;padding:4px 0;outline:none;font-variant-numeric:tabular-nums}
select{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mid{display:flex;align-items:center;gap:12px;margin:14px 0}
.mid hr{flex:1;border:0;border-top:1px dashed var(--line);margin:0}
.swap{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#1b1408;font-size:22px;cursor:pointer;
  transition:transform .25s}
.swap:active{transform:rotate(180deg)}
.result{font-size:34px;font-weight:650;word-break:break-all;font-variant-numeric:tabular-nums;min-height:46px}
.rate{font-size:14px;color:var(--muted);margin-top:4px}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
  font-size:13px;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 12px}
.status b{color:var(--ink);font-weight:600}
.status.stale{color:var(--warn)}
.refresh{flex:none;border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:8px 12px;min-height:40px;font:inherit;font-size:13px;cursor:pointer}
.refresh[disabled]{opacity:.6}
h2{font-size:15px;margin:24px 4px 8px;color:var(--muted);font-weight:600}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list li:last-child{border-bottom:0}
.list .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;overflow-wrap:anywhere}
.list .n{color:var(--muted)}
.chips{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
@media (min-width:700px){
  .wrap{max-width:1040px;padding:28px 28px 40px}
  h1{font-size:32px}
  .chips{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0 14px;-webkit-mask-image:none;mask-image:none}
  .grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
  .grid h2{margin-top:6px}
  .side{position:sticky;top:16px}
}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
.foot a{color:inherit}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Converter</h1></header>

  <nav class="chips" id="cats" aria-label="Categories"></nav>

  <div class="grid">
  <section class="card side">
    <div class="row">
      <label class="lab" for="amt">From</label>
      <input id="amt" class="amount" inputmode="decimal" autocomplete="off" value="1">
      <select id="from" aria-label="From unit"></select>
    </div>
    <div class="mid"><hr><button class="swap" id="swap" aria-label="Swap units">⇅</button><hr></div>
    <div class="row">
      <span class="lab">To</span>
      <div class="result" id="out">—</div>
      <select id="to" aria-label="To unit"></select>
    </div>
    <div class="rate" id="rateline"></div>
    <div class="status hide" id="status">
      <span id="stattext">Loading rates…</span>
      <button class="refresh" id="refresh">Update</button>
    </div>
  </section>

  <div>
  <h2 id="alltitle">All units</h2>
  <section class="card" style="padding:4px 12px"><ul class="list" id="all"></ul></section>
  </div>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
{
// ---------- Unit data: f = how many base units one of this unit equals ----------
const CATS = [
 {id:'currency', name:'Currency'},
 {id:'length', name:'Length', units:[
  ['mm','Millimeter',.001],['cm','Centimeter',.01],['m','Meter',1],['km','Kilometer',1000],
  ['in','Inch',.0254],['ft','Foot',.3048],['yd','Yard',.9144],['mi','Mile',1609.344],['nmi','Nautical mile',1852]]},
 {id:'weight', name:'Weight', units:[
  ['mg','Milligram',1e-6],['g','Gram',.001],['kg','Kilogram',1],['t','Tonne (metric)',1000],
  ['oz','Ounce',.028349523125],['lb','Pound',.45359237],['st','Stone',6.35029318],
  ['ton_us','Ton (US short)',907.18474],['ton_uk','Ton (UK long)',1016.0469088]]},
 {id:'temp', name:'Temperature', units:[
  ['c','Celsius °C',{to:v=>v,from:b=>b}],
  ['f','Fahrenheit °F',{to:v=>(v-32)*5/9,from:b=>b*9/5+32}],
  ['k','Kelvin K',{to:v=>v-273.15,from:b=>b+273.15}]]},
 {id:'volume', name:'Volume', units:[
  ['ml','Milliliter',.001],['l','Liter',1],['m3','Cubic meter',1000],
  ['tsp','Teaspoon (US)',.00492892159375],['tbsp','Tablespoon (US)',.01478676478125],
  ['floz','Fluid ounce (US)',.0295735295625],['cup','Cup (US)',.2365882365],
  ['pt','Pint (US)',.473176473],['qt','Quart (US)',.946352946],['gal','Gallon (US)',3.785411784],
  ['floz_uk','Fluid ounce (UK)',.0284130625],['pt_uk','Pint (UK)',.56826125],['gal_uk','Gallon (UK)',4.54609],
  ['in3','Cubic inch',.016387064],['ft3','Cubic foot',28.316846592]]},
 {id:'area', name:'Area', units:[
  ['cm2','Square centimeter',1e-4],['m2','Square meter',1],['dunam','Dunam',1000],['ha','Hectare',1e4],
  ['km2','Square kilometer',1e6],['in2','Square inch',.00064516],['ft2','Square foot',.09290304],
  ['yd2','Square yard',.83612736],['acre','Acre',4046.8564224],['mi2','Square mile',2589988.110336]]},
 {id:'speed', name:'Speed', units:[
  ['kmh','Kilometers / hour',1/3.6],['ms','Meters / second',1],['mph','Miles / hour',.44704],
  ['kn','Knot',1852/3600],['fts','Feet / second',.3048]]},
 {id:'fuel', name:'Fuel', units:[
  ['l100','Liters / 100 km',{to:v=>v,from:b=>b}],
  ['kml','Kilometers / liter',{to:v=>100/v,from:b=>100/b}],
  ['mpg','Miles / gallon (US)',{to:v=>235.214583/v,from:b=>235.214583/b}],
  ['mpg_uk','Miles / gallon (UK)',{to:v=>282.480936/v,from:b=>282.480936/b}]]},
 {id:'time', name:'Time', units:[
  ['ms_t','Millisecond',.001],['s','Second',1],['min','Minute',60],['h','Hour',3600],['d','Day',86400],
  ['wk','Week',604800],['mo','Month (avg)',2629746],['yr','Year (avg)',31556952]]},
 {id:'data', name:'Data', units:[
  ['bit','Bit',.125],['B','Byte',1],['KB','Kilobyte (KB)',1e3],['MB','Megabyte (MB)',1e6],['GB','Gigabyte (GB)',1e9],
  ['TB','Terabyte (TB)',1e12],['KiB','Kibibyte (KiB)',1024],['MiB','Mebibyte (MiB)',1048576],
  ['GiB','Gibibyte (GiB)',1073741824],['TiB','Tebibyte (TiB)',1099511627776]]},
 {id:'pressure', name:'Pressure', units:[
  ['pa','Pascal',1],['kpa','Kilopascal',1000],['bar','Bar',1e5],['atm','Atmosphere',101325],
  ['psi','PSI',6894.757293168],['mmhg','mmHg',133.322387415]]},
 {id:'energy', name:'Energy', units:[
  ['j','Joule',1],['kj','Kilojoule',1000],['cal','Calorie',4.184],['kcal','Kilocalorie (food Cal)',4184],
  ['wh','Watt-hour',3600],['kwh','Kilowatt-hour',3.6e6],['btu','BTU',1055.05585262]]},
];
const DEFAULTS = {currency:['USD','ILS'],length:['cm','in'],weight:['kg','lb'],temp:['c','f'],volume:['l','gal'],
  area:['m2','ft2'],speed:['kmh','mph'],fuel:['l100','mpg'],time:['h','min'],data:['GB','MB'],pressure:['bar','psi'],energy:['kcal','kj']};
const POPULAR = ['USD','EUR','ILS','GBP','JPY','CHF','CAD','AUD','CNY','INR','TRY','AED','THB','RUB','UAH','EGP','JOD'];

// ---------- Storage (safe) ----------
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

// ---------- Currency rates ----------
const MAX_AGE = 6*3600*1000;          // check for new rates every 6 hours
let rates = store.get('rates');        // {base, rates:{CODE:per-1-base}, updated:ms, fetched:ms, source}

async function fetchJSON(url){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 10000);
  try{ const r = await fetch(url,{signal:ctl.signal,cache:'no-store'}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
const SOURCES = [
  { name:'Exchange Rate API', link:'https://www.exchangerate-api.com',
    async load(){ const j = await fetchJSON('https://open.er-api.com/v6/latest/USD');
      if(j.result!=='success'||!j.rates) throw new Error('bad data');
      return {base:'USD', rates:j.rates, updated:j.time_last_update_unix*1000}; } },
  { name:'Frankfurter (ECB)', link:'https://frankfurter.dev',
    async load(){ const j = await fetchJSON('https://api.frankfurter.dev/v1/latest?base=USD');
      if(!j.rates) throw new Error('bad data');
      return {base:'USD', rates:{...j.rates, USD:1}, updated:Date.parse(j.date+'T16:00:00+01:00')}; } },
];
let loading = false;
async function updateRates(force){
  if(loading) return;
  if(!force && rates && Date.now()-rates.fetched < MAX_AGE) return;
  loading = true; renderStatus();
  for(const s of SOURCES){
    try{ const d = await s.load(); rates = {...d, fetched:Date.now(), source:s.name, link:s.link};
      store.set('rates', rates); break; }
    catch(e){ /* try next source */ }
  }
  loading = false;
  if(cat.id==='currency') buildSelects(true);
  render();
}

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let curNames = null;
try{ curNames = new Intl.DisplayNames(['en'],{type:'currency'}); }catch(e){}
const curName = c => { try{ return curNames ? curNames.of(c) : c; }catch(e){ return c; } };

function unitsOf(c){
  if(c.id!=='currency') return c.units.map(([id,name,f])=>({id,name,f}));
  if(!rates) return [];
  return Object.keys(rates.rates).sort().map(code=>({id:code,name:code+' · '+curName(code),cur:true}));
}
function toBase(u,v){ return u.cur ? v / rates.rates[u.id] : (typeof u.f==='object' ? u.f.to(v) : v*u.f); }
function fromBase(u,b){ return u.cur ? b * rates.rates[u.id] : (typeof u.f==='object' ? u.f.from(b) : b/u.f); }
function convert(u1,u2,v){ return fromBase(u2,toBase(u1,v)); }

function fmt(n, isCur){
  if(!isFinite(n)) return '—';
  const a = Math.abs(n);
  if(a!==0 && (a>=1e15 || a<1e-6)) return n.toExponential(4).replace('e+','e');
  if(isCur) return n.toLocaleString('en-US',{maximumFractionDigits: a>=1 ? 2 : 4, minimumFractionDigits: 2});
  return n.toLocaleString('en-US',{maximumSignificantDigits:7});
}
function parseAmount(s){
  s = String(s).trim().replace(/\s/g,'');
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g,''); // 1,234.5
  else s = s.replace(',', '.');                                   // 1,5 -> 1.5
  const n = parseFloat(s); return isNaN(n) ? null : n;
}
function ago(ms){
  const m = Math.round((Date.now()-ms)/60000);
  if(m<1) return 'just now'; if(m<60) return m+' min ago';
  const h = Math.round(m/60); if(h<24) return h+' h ago';
  const d = Math.round(h/24); return d+(d===1?' day ago':' days ago');
}
// 24-hour time in the phone's own time zone, e.g. "Tue 24 Nov, 02:02 (GMT+2)"
const fmtDate = ms => {
  const d = new Date(ms);
  const day = d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace(',','');
  const time = d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  let zone = '';
  try{ zone = d.toLocaleTimeString('en-GB',{timeZoneName:'short'}).split(' ').pop(); }catch(e){}
  return `${day}, ${time}` + (zone ? ` (${zone})` : '');
};

// ---------- State ----------
const saved = store.get('state') || {};
let cat = CATS.find(c=>c.id===saved.cat) || CATS[0];
let picks = saved.picks || {};
const save = () => store.set('state',{cat:cat.id,picks,amt:$('amt').value});
if(saved.amt) $('amt').value = saved.amt;

// ---------- Rendering ----------
$('cats').innerHTML = CATS.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${c===cat}">${c.name}</button>`).join('');

function optionsHTML(list){
  if(cat.id!=='currency') return list.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('');
  const pop = POPULAR.filter(c=>rates && rates.rates[c]!=null);
  const byId = Object.fromEntries(list.map(u=>[u.id,u]));
  return `<optgroup label="Popular">${pop.map(c=>`<option value="${esc(c)}">${esc(byId[c].name)}</option>`).join('')}</optgroup>`+
         `<optgroup label="All currencies">${list.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('')}</optgroup>`;
}
function buildSelects(keep){
  const list = unitsOf(cat);
  const html = optionsHTML(list);
  $('from').innerHTML = html; $('to').innerHTML = html;
  const p = picks[cat.id] || DEFAULTS[cat.id];
  const has = id => list.some(u=>u.id===id);
  $('from').value = has(p[0]) ? p[0] : (list[0]||{}).id || '';
  $('to').value   = has(p[1]) ? p[1] : (list[1]||{}).id || '';
}
function renderStatus(){
  const st = $('status'), isCur = cat.id==='currency';
  st.classList.toggle('hide', !isCur);
  if(!isCur) return;
  $('refresh').disabled = loading;
  $('refresh').textContent = loading ? 'Updating…' : 'Update';
  if(!rates){ $('stattext').innerHTML = loading ? 'Loading today’s rates…' : 'Couldn’t load rates. Check your connection and tap Update.'; st.classList.toggle('stale',!loading); return; }
  const old = Date.now()-rates.updated > 3*86400000;
  st.classList.toggle('stale', old);
  $('stattext').innerHTML = `Rates updated <b>${esc(fmtDate(rates.updated))}</b><br>Checked ${esc(ago(rates.fetched))}${navigator.onLine?'':' · offline'}`;
}
function render(){
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.c===cat.id));
  renderStatus();
  const list = unitsOf(cat), isCur = cat.id==='currency';
  const u1 = list.find(u=>u.id===$('from').value), u2 = list.find(u=>u.id===$('to').value);
  const v = parseAmount($('amt').value);
  $('alltitle').textContent = isCur ? 'Popular currencies' : 'All units';
  if(!u1 || !u2 || v===null){
    $('out').textContent = '—'; $('rateline').textContent = ''; $('all').innerHTML = ''; return;
  }
  $('out').textContent = fmt(convert(u1,u2,v), isCur) + (isCur ? ' ' + u2.id : '');
  $('rateline').textContent = (cat.id==='temp'||cat.id==='fuel') ? '' :
    `1 ${isCur?u1.id:u1.name} = ${fmt(convert(u1,u2,1), isCur)} ${isCur?u2.id:u2.name}`;
  const shown = isCur ? POPULAR.filter(c=>rates.rates[c]!=null && c!==u1.id).map(c=>list.find(u=>u.id===c)) : list.filter(u=>u!==u1);
  $('all').innerHTML = shown.map(u=>`<li data-u="${esc(u.id)}"><span class="n">${esc(u.name)}</span><span class="v">${esc(fmt(convert(u1,u,v),isCur))}</span></li>`).join('');
  $('foot').innerHTML = isCur && rates ? `Rates By <a href="${esc(rates.link)}" target="_blank" rel="noopener">${esc(rates.source)}</a> · mid-market reference rates, your bank’s rate will differ.` : '';
  picks[cat.id] = [u1.id, u2.id]; save();
}

// ---------- Events ----------
$('cats').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  cat = CATS.find(c=>c.id===b.dataset.c); buildSelects(); render();
  if(cat.id==='currency') updateRates(false);
});
$('amt').addEventListener('input', render);
$('from').addEventListener('change', render);
$('to').addEventListener('change', render);
$('swap').addEventListener('click', ()=>{ const a=$('from').value; $('from').value=$('to').value; $('to').value=a; render(); });
$('refresh').addEventListener('click', ()=>updateRates(true));
$('all').addEventListener('click', e=>{ const li=e.target.closest('li'); if(li){ $('to').value=li.dataset.u; render(); window.scrollTo({top:0,behavior:'smooth'}); }});
$('amt').addEventListener('focus', e=>e.target.select());
window.addEventListener('online', ()=>{ renderStatus(); updateRates(false); });
window.addEventListener('offline', renderStatus);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) updateRates(false); });
setInterval(renderStatus, 60000);

// ---------- Start ----------
buildSelects(); render(); updateRates(false);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
}
</script>
</body>
</html>
